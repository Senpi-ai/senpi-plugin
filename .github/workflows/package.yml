name: package
# Builds the plugin archive that installs in both Claude and ChatGPT
# (scripts/package.py), for prod and dev, and keeps each as the run's artifact.
# It only builds: nothing is uploaded to ChatGPT, Claude or any marketplace,
# and no release is published.
#
# This workflow and scripts/ live only on the release branch. main holds just
# the plugin, because the Claude plugin directory refuses .py files from
# organizations that aren't Verified. To ship: merge main into release, then
# download the zip from that push's run.
on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [prod, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are up to date
        run: python3 scripts/build-manifests.py --check
      - id: meta
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          case "$ENVIRONMENT" in
            prod) url=https://mcp.senpi.ai/mcp; zip="senpi-agent-$version.zip" ;;
            dev)  url=https://senpi-agent-bridge.dev.senpi.ai/connector/mcp; zip="senpi-agent-$version-dev.zip" ;;
            *)    echo "::error::unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          { echo "url=$url"; echo "zip=$zip"; } >> "$GITHUB_OUTPUT"
      - name: Build (${{ matrix.environment }})
        run: python3 scripts/package.py --mcp-url "${{ steps.meta.outputs.url }}" "dist/${{ steps.meta.outputs.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: dist/${{ steps.meta.outputs.zip }}
          if-no-files-found: error
